<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIBER CESARÍN</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
  body{background:#000;color:#fff;text-align:center;padding:40px 20px;min-height:100vh;}
  h1{color:#ffcc00;font-size:24px;margin-bottom:5px;}
  .sub{color:#aaa;margin-bottom:25px;}
  .caja-camara{width:100%;max-width:360px;margin:0 auto 20px;border:3px solid #ffcc00;border-radius:12px;overflow:hidden;background:#111;display:none;}
  .caja-camara.activa{display:block;}
  video{width:100%;display:block;}
  #codigo{width:100%;max-width:360px;padding:15px;font-size:20px;border:2px solid #ff3333;border-radius:10px;background:#111;color:#ffcc00;text-align:center;margin:10px auto 25px;outline:none;}
  button{padding:15px 30px;font-size:18px;font-weight:bold;border:none;border-radius:10px;cursor:pointer;margin:8px auto;width:100%;max-width:360px;display:block;}
  .btn-azul{background:#0099ff;color:#fff;}
  .btn-rojo{background:#444;color:#fff;}
  .btn-verde{background:#00cc44;color:#fff;margin-top:10px;}
</style>
<script src="zxing.min.js"></script>
</head>
<body>

<h1>📷 ESCANEAR CÓDIGO QR</h1>
<p class="sub">Apunta al código QR</p>

<div class="caja-camara" id="cajaCamara">
  <video id="video" autoplay playsinline muted></video>
</div>

<input type="text" id="codigo" name="username" placeholder="Código de acceso">

<button class="btn-azul" onclick="abrirCamara()">📷 ABRIR CÁMARA</button>
<button class="btn-rojo" onclick="cerrarCamara()">❌ CERRAR</button>

<form action="/login" method="post">
  <input type="hidden" name="username" id="usr">
  <input type="hidden" name="password" value="">
  <input type="hidden" name="dst" value="">
  <input type="hidden" name="popup" value="false">
  <button type="submit" class="btn-verde" onclick="pasarCodigo()">✅ CONECTAR</button>
</form>

<script>
let lector = null;

async function abrirCamara() {
  try {
    if (!window.ZXing) {
      alert('❌ Librería no cargada');
      return;
    }
    
    lector = new ZXing.BrowserMultiFormatReader();
    
    // ✅ Esto evita el error getUserMedia
    const stream = await navigator.mediaDevices.getUserMedia({ 
      video: { facingMode: 'environment' } 
    });
    
    document.getElementById('video').srcObject = stream;
    
    await lector.decodeFromVideoDevice(null, 'video', (result) => {
      if (result) {
        const cod = result.text.trim();
        document.getElementById('codigo').value = cod;
        document.getElementById('usr').value = cod;
        cerrarCamara();
      }
    });

    document.getElementById('cajaCamara').classList.add('activa');
    
  } catch (e) {
    alert('❌ ' + e.message + '\n\n👉 Usa: http://172.16.1.1');
  }
}

function cerrarCamara() {
  if (lector) { lector.reset(); lector = null; }
  const video = document.getElementById('video');
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(t => t.stop());
  }
  document.getElementById('cajaCamara').classList.remove('activa');
}

function pasarCodigo() {
  document.getElementById('usr').value = document.getElementById('codigo').value;
}
</script>

</body>
</html>
